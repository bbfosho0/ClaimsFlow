name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        shell: bash
        run: |
          set -o pipefail
          mvn -q verify > maven-verify.log 2>&1 || { tail -n 180 maven-verify.log; exit 1; }
          tail -n 40 maven-verify.log
        working-directory: backend
      - name: Preserve backend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verify-log
          path: backend/maven-verify.log
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
        working-directory: frontend
      - name: Run frontend tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci > frontend-test.log 2>&1 || { tail -n 180 frontend-test.log; exit 1; }
          tail -n 40 frontend-test.log
        working-directory: frontend
      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build > frontend-build.log 2>&1 || { tail -n 180 frontend-build.log; exit 1; }
          tail -n 40 frontend-build.log
        working-directory: frontend
      - name: Preserve frontend failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 3
