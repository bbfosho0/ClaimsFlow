name: Visual QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: claimsflow
          POSTGRES_USER: claimsflow
          POSTGRES_PASSWORD: claimsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsflow -d claimsflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --silent
        working-directory: frontend

      - name: Start Spring Boot API
        shell: bash
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/claimsflow
          DB_USERNAME: claimsflow
          DB_PASSWORD: claimsflow
          CLAIMSFLOW_DEMO_ENABLED: 'true'
        run: |
          mvn -q spring-boot:run > /tmp/claimsflow-api.log 2>&1 &
          echo $! > /tmp/claimsflow-api.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 /tmp/claimsflow-api.log
          exit 1

      - name: Start Angular application
        shell: bash
        working-directory: frontend
        run: |
          npm start -- --host 127.0.0.1 --port 4200 > /tmp/claimsflow-ng.log 2>&1 &
          echo $! > /tmp/claimsflow-ng.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/tour > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 /tmp/claimsflow-ng.log
          exit 1

      - name: Reset deterministic golden journey
        shell: bash
        run: |
          RESET_JSON="$(curl --fail --silent --show-error -X POST http://127.0.0.1:4200/api/demo/reset)"
          CLAIM_ID="$(node -e "const value=JSON.parse(process.argv[1]); if(!value.claimId) process.exit(1); process.stdout.write(value.claimId)" "$RESET_JSON")"
          ADJUSTER_ID="$(node -e "const value=JSON.parse(process.argv[1]); if(!value.adjusterId) process.exit(1); process.stdout.write(value.adjusterId)" "$RESET_JSON")"
          echo "CLAIM_ID=$CLAIM_ID" >> "$GITHUB_ENV"
          echo "ADJUSTER_ID=$ADJUSTER_ID" >> "$GITHUB_ENV"
          echo "Created visual-QA claim $CLAIM_ID assigned to $ADJUSTER_ID"

      - name: Capture desktop golden journey and premium routes
        shell: bash
        run: |
          mkdir -p visual-qa
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chrome executable not found"
            exit 1
          fi

          capture() {
            local name="$1"
            local url="$2"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=1440,1180 \
              --virtual-time-budget=6000 \
              --screenshot="visual-qa/${name}-1440x1180.png" \
              "$url"
          }

          capture tour "http://127.0.0.1:4200/tour"
          capture claimant-portal "http://127.0.0.1:4200/portal/claims/${CLAIM_ID}"
          capture adjuster-claim "http://127.0.0.1:4200/app/claims/${CLAIM_ID}?role=adjuster"
          capture manager-dashboard "http://127.0.0.1:4200/app/dashboard?role=manager&claimId=${CLAIM_ID}"
          capture manager-queue "http://127.0.0.1:4200/app/claims?role=manager&claimId=${CLAIM_ID}"
          capture administrator-workflows "http://127.0.0.1:4200/app/workflows?role=admin&claimId=${CLAIM_ID}"
          capture analytics "http://127.0.0.1:4200/app/analytics?role=manager"
          capture documents "http://127.0.0.1:4200/app/documents?role=adjuster"
          capture team-ops "http://127.0.0.1:4200/app/team-ops?role=manager"

      - name: Capture mobile claimant and employee surfaces
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"

          capture_mobile() {
            local name="$1"
            local url="$2"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=390,844 \
              --virtual-time-budget=6000 \
              --screenshot="visual-qa/${name}-mobile-390x844.png" \
              "$url"
          }

          capture_mobile tour "http://127.0.0.1:4200/tour"
          capture_mobile claimant-portal "http://127.0.0.1:4200/portal/claims/${CLAIM_ID}"
          capture_mobile adjuster-claim "http://127.0.0.1:4200/app/claims/${CLAIM_ID}?role=adjuster"
          capture_mobile manager-dashboard "http://127.0.0.1:4200/app/dashboard?role=manager&claimId=${CLAIM_ID}"

      - name: Validate screenshot set
        shell: bash
        run: |
          count="$(find visual-qa -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$count" -eq 13
          test -s visual-qa/claimant-portal-1440x1180.png
          test -s visual-qa/administrator-workflows-1440x1180.png
          test -s visual-qa/manager-dashboard-mobile-390x844.png
          echo "Validated $count rendered screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: claimsflow-role-aware-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 5

      - name: Preserve application logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claimsflow-visual-qa-logs
          path: |
            /tmp/claimsflow-api.log
            /tmp/claimsflow-ng.log
          if-no-files-found: warn
          retention-days: 3
