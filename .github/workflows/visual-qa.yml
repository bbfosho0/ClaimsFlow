name: Visual QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: claimsflow
          POSTGRES_USER: claimsflow
          POSTGRES_PASSWORD: claimsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsflow -d claimsflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --silent
        working-directory: frontend

      - name: Start Spring Boot API
        shell: bash
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/claimsflow
          DB_USERNAME: claimsflow
          DB_PASSWORD: claimsflow
          CLAIMSFLOW_DEMO_ENABLED: 'true'
        run: |
          mvn -q spring-boot:run > /tmp/claimsflow-api.log 2>&1 &
          echo $! > /tmp/claimsflow-api.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 /tmp/claimsflow-api.log
          exit 1

      - name: Start Angular application
        shell: bash
        working-directory: frontend
        run: |
          npm start -- --host 127.0.0.1 --port 4200 > /tmp/claimsflow-ng.log 2>&1 &
          echo $! > /tmp/claimsflow-ng.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/tour > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 /tmp/claimsflow-ng.log
          exit 1

      - name: Capture reactive employer journey
        shell: bash
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:4200
          OUTPUT_DIRECTORY: visual-qa
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chrome executable not found"
            exit 1
          fi
          CHROME_EXECUTABLE="$CHROME" node scripts/capture-operational-visual-qa.mjs

      - name: Validate screenshot set
        shell: bash
        working-directory: frontend
        run: |
          count="$(find visual-qa -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$count" -eq 18
          expected=(
            tour-1440x1180.png
            claimant-portal-1440x1180.png
            adjuster-claim-1440x1180.png
            manager-dashboard-baseline-1440x1180.png
            manager-dashboard-after-evidence-1440x1180.png
            manager-dashboard-stale-1440x1180.png
            manager-dashboard-reduced-motion-1440x1180.png
            manager-queue-sla-filtered-1440x1180.png
            analytics-default-1440x1180.png
            analytics-west-filtered-1440x1180.png
            team-operations-default-1440x1180.png
            team-operations-filtered-1440x1180.png
            evidence-operations-1440x1180.png
            evidence-operations-after-update-1440x1180.png
            administrator-workflows-1440x1180.png
            claimant-portal-mobile-390x844.png
            manager-dashboard-mobile-390x844.png
            evidence-operations-mobile-390x844.png
          )
          for file in "${expected[@]}"; do
            test -s "visual-qa/$file"
          done
          echo "Validated $count rendered operational screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: claimsflow-operational-visual-qa
          path: frontend/visual-qa/*.png
          if-no-files-found: error
          retention-days: 5

      - name: Preserve application logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claimsflow-visual-qa-logs
          path: |
            /tmp/claimsflow-api.log
            /tmp/claimsflow-ng.log
          if-no-files-found: warn
          retention-days: 3
