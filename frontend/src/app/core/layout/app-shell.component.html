<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <aside class="app-sidebar" aria-label="Primary navigation">
    <div class="sidebar-top">
      <a class="brand-block" routerLink="/" aria-label="ClaimsFlow showcase">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-copy"><strong>ClaimsFlow</strong><small>Intelligent claims</small></span>
      </a>

      <nav class="primary-nav" aria-label="ClaimsFlow destinations">
        <a
          *ngFor="let item of navigation"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          ariaCurrentWhenActive="page"
          (click)="closeMobileDrawer()">
          <span class="active-signal" aria-hidden="true"></span>
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <section class="copilot-card" aria-label="AI Copilot">
        <div class="copilot-heading"><strong>AI Copilot</strong><span>BETA</span></div>
        <div class="copilot-orb" aria-hidden="true"><i></i><b></b></div>
        <strong>Ask Copilot</strong>
        <p>Get insights, summaries, and recommendations.</p>
        <button type="button">Ask a question <span aria-hidden="true">→</span></button>
      </section>

      <div class="operator-block" aria-label="Current operator">
        <span class="operator-avatar" aria-hidden="true">AM</span>
        <span class="operator-copy"><strong>Alex Morgan</strong><small>Claims Manager</small></span>
        <span class="operator-menu" aria-hidden="true">⌄</span>
      </div>
    </div>
  </aside>

  <section class="workspace-shell">
    <header class="app-topbar">
      <div class="route-context">
        <strong>{{ shellTitle() }}</strong>
        <span>{{ shellSubtitle() }}</span>
      </div>

      <label class="global-search">
        <span class="search-symbol" aria-hidden="true"></span>
        <span class="sr-only">Global search</span>
        <input type="search" placeholder="Search claims, policies, documents, people…" />
        <kbd>⌘K</kbd>
      </label>

      <div class="topbar-spacer"></div>
      <button class="topbar-icon notification-button" type="button" aria-label="Notifications"><span aria-hidden="true">♢</span><b>3</b></button>
      <button class="topbar-icon" type="button" aria-label="Help"><span aria-hidden="true">?</span></button>
      <div class="topbar-profile" aria-label="Alex Morgan, Claims Manager">
        <span class="operator-avatar" aria-hidden="true">AM</span>
        <span><strong>Alex Morgan</strong><small>Claims Manager</small></span>
        <i aria-hidden="true">⌄</i>
      </div>
      <button class="mobile-more" type="button" (click)="toggleMobileDrawer()" [attr.aria-expanded]="mobileDrawerOpen()" aria-controls="mobile-destination-drawer">More</button>
    </header>

    <div *ngIf="mobileDrawerOpen()" id="mobile-destination-drawer" class="mobile-drawer">
      <a *ngFor="let item of navigation.slice(5)" [routerLink]="item.path" (click)="closeMobileDrawer()">
        <span aria-hidden="true">{{ item.icon }}</span>{{ item.label }}
      </a>
    </div>

    <main id="main-content" tabindex="-1" class="app-workspace">
      <div class="workspace-atmosphere" aria-hidden="true"></div>
      <div class="app-content"><router-outlet /></div>
    </main>
  </section>
</div>
