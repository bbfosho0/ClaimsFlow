<aside class="tour-controller" *ngIf="current() as step" [class.collapsed]="collapsed()" aria-label="Guided product tour" aria-live="polite">
  <div class="tour-progress"><span [style.width.%]="(step.index + 1) / orchestrator.steps.length * 100"></span></div>
  <div class="tour-topline"><span>GUIDED TOUR · {{ step.index + 1 }} / {{ orchestrator.steps.length }}</span><div><button type="button" (click)="collapsed.set(!collapsed())" [attr.aria-label]="collapsed() ? 'Expand guided tour' : 'Collapse guided tour'">{{ collapsed() ? '□' : '−' }}</button><button type="button" (click)="exit()" aria-label="Exit guided tour">×</button></div></div>
  <ng-container *ngIf="!collapsed()">
    <h2>{{ step.title }}</h2>
    <p>{{ step.notice }}</p>
    <button class="technical-toggle" type="button" (click)="expanded.set(!expanded())" [attr.aria-expanded]="expanded()">{{ expanded() ? 'Hide' : 'Show' }} technical proof <span aria-hidden="true">{{ expanded() ? '↑' : '↓' }}</span></button>
    <div class="technical-proof" *ngIf="expanded()"><span aria-hidden="true">◆</span><p>{{ step.technicalProof }}</p></div>
    <div class="tour-actions"><button class="button secondary" type="button" [disabled]="step.index === 0" (click)="previous()">← Previous</button><button class="button primary" type="button" (click)="next()">{{ step.index === orchestrator.steps.length - 1 ? 'Finish tour' : 'Next step →' }}</button></div>
    <div class="tour-shortcuts"><span>← / → navigate</span><span>Esc exits</span></div>
  </ng-container>
</aside>
